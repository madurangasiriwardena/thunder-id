# .github/workflows/api-quality-gate.yml
#
# API production-completeness quality gate (Plan A — API contract gate).
#
# Every job here is intended to be wired as a REQUIRED status check. Branch
# protection is administered at the repository level, so these are the context
# names an administrator needs:
#   validate-exemptions, validate-api-design, detect-breaking-changes,
#   contract-tests, validate-test-coverage
#
# Tooling layout note: the npm-based gate tooling lives in api-quality-gate/ (a
# self-contained package) rather than the repo root, because the root is a pnpm
# monorepo — a second npm package.json at the root would collide with pnpm. The
# ruleset resolves override globs relative to its own directory, so the enforced
# pilot spec (repo-root api/group.yaml) is referenced from the tooling dir as
# ../api/group.yaml.
#
# Node follows the repo .nvmrc. Spectral 6.x supports node ">= 20.17" (incl. 22/24);
# the transitive ajv codegen crash is fixed by the ajv `overrides` pin in
# api-quality-gate/package.json, not by constraining the Node version.

name: 📐 API Quality Gate

on:
  pull_request:
    branches: [main]
  merge_group: {}   # run again against the merged state in the merge queue

# Which specs are gated is a DENY list: every api/*.yaml except those named in
# api-quality-gate/governance/excluded-specs.yaml. A newly added spec is therefore
# validated automatically, and opting out takes an explicit entry in a governed
# file. `node scripts/list-specs.mjs` resolves the list.

permissions:
  contents: read

jobs:
  validate-exemptions:
    name: validate-exemptions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-quality-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Validate + expire exemptions, emit effective ruleset
        run: node scripts/validate-exemptions.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: effective-ruleset
          path: api-quality-gate/.spectral.effective.yaml
          retention-days: 5

  validate-api-design:
    name: validate-api-design
    needs: validate-exemptions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-quality-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changed-spec diff needs a merge base
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Rebuild effective ruleset (base + governed exemptions)
        run: node scripts/validate-exemptions.mjs
      # Only the specs this PR touches are gated, and each is judged against its own
      # state on the base branch: a change may not ADD findings, but is not charged
      # for the file's existing backlog. Linting a changed spec outright would
      # report 65 failures for a one-line fix to api/user.yaml and train everyone to
      # ignore the check. The whole surface is covered by api-design-audit.yml on a
      # schedule instead.
      - name: Lint specs changed by this pull request
        run: |
          set -uo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=1 origin "$base_ref"
          gated="$(node scripts/list-specs.mjs)"
          rc=0
          : > changed-specs.txt
          for spec in $(git -C .. diff --name-only FETCH_HEAD...HEAD -- 'api/**/*.yaml' 'api/*.yaml'); do
            # Only specs the deny list actually gates, and only those still present
            # (a deleted spec has nothing to lint).
            grep -qxF "$spec" <<<"$gated" || { echo "::notice::${spec} is excluded from the gate; skipping."; continue; }
            [ -f "../$spec" ] || continue
            echo "$spec" >> changed-specs.txt
            echo "::group::$spec"
            node scripts/lint-diff.mjs "$spec" --base-ref FETCH_HEAD || rc=1
            echo "::endgroup::"
          done
          if [ ! -s changed-specs.txt ]; then
            echo "No gated spec changed by this pull request."
          fi
          exit $rc
      - name: Publish the changed-spec list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: changed-specs
          path: api-quality-gate/changed-specs.txt
          retention-days: 5
          if-no-files-found: warn

  detect-breaking-changes:
    name: detect-breaking-changes
    runs-on: ubuntu-latest
    env:
      # Pinned by version AND digest: `latest` would let the gate's verdict change
      # without a commit, and would run whatever an upstream retag published.
      OASDIFF_IMAGE: tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: api-quality-gate
      - name: Detect breaking changes against the base branch (oasdiff)
        run: |
          set -uo pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=1 origin "$base_ref"
          mkdir -p /tmp/base
          gated="$(node api-quality-gate/scripts/list-specs.mjs)"
          rc=0
          # Only specs this PR touched: an unchanged spec cannot have gained a
          # breaking change, so diffing all of them is wasted container time.
          for spec in $(git diff --name-only FETCH_HEAD...HEAD -- 'api/**/*.yaml' 'api/*.yaml'); do
            grep -qxF "$spec" <<<"$gated" || continue
            # Absent from the PR means the spec list is wrong, not that the API is new.
            if [[ ! -f "$spec" ]]; then
              echo "::error::${spec} is listed for validation but missing from the working tree."
              rc=1; continue
            fi
            # Only a genuinely absent base file may skip the comparison. Any other
            # failure must fail the job: falling back to comparing the spec with
            # itself would make this required check pass unconditionally.
            if ! git cat-file -e "FETCH_HEAD:${spec}" 2>/dev/null; then
              echo "::notice::${spec} does not exist on ${base_ref}; treating it as a new spec."
              continue
            fi
            base="/tmp/base/$(echo "$spec" | tr '/' '_')"
            git show "FETCH_HEAD:${spec}" > "$base" || { echo "::error::cannot read ${spec} on ${base_ref}"; rc=1; continue; }
            echo "::group::$spec"
            docker run --rm -v "$PWD:/work" -v /tmp/base:/base "$OASDIFF_IMAGE" \
              breaking "/base/$(basename "$base")" "/work/${spec}" --fail-on ERR || rc=1
            echo "::endgroup::"
          done
          exit $rc

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    # Deliberately NOT scoped to changed specs, and independent of api-lint. Its job
    # is proving the running service still honours the contract, so a backend change
    # that breaks it must be caught even when no spec was touched.
    # SQLite is the repo default (tests/integration/main.go) and the sqlite leg of
    # pr-builder's integration matrix, so no service container and no schema seeding
    # are needed: the build initialises the SQLite databases itself.
    # Secret-free by design so it runs on fork PRs. Never switch to pull_request_target.
    steps:
      - uses: actions/checkout@v7
      - name: Resolve contract packages
        id: resolve
        run: |
          set -euo pipefail
          resources=""
          for dir in tests/integration/contract/*/; do
            [ -d "$dir" ] || continue
            resources="${resources} $(basename "$dir")"
          done
          echo "resources=${resources# }" >> "$GITHUB_OUTPUT"
          [ -n "$resources" ] && echo "Contract packages:${resources}" || echo "::notice::No contract packages found."
      - name: Set up Go environment
        if: steps.resolve.outputs.resources != ''
        uses: ./.github/actions/setup-go
      - name: Install dependencies
        if: steps.resolve.outputs.resources != ''
        run: |
          cd backend && go mod download
          cd ../tests/integration && go mod download
      - name: Build distribution
        if: steps.resolve.outputs.resources != ''
        run: make build_with_coverage_only OS=$(go env GOOS) ARCH=$(go env GOARCH)
      - name: Configure test database
        if: steps.resolve.outputs.resources != ''
        run: |
          chmod +x tests/integration/resources/scripts/setup-test-config.sh
          ./tests/integration/resources/scripts/setup-test-config.sh
        env:
          DB_TYPE: sqlite
      # Boots the built distribution against SQLite and asserts the contract at
      # runtime (usable next link, 409 conflict; filter/idempotency/cross-tenant are
      # scaffolded, see tests/integration/contract/<resource>).
      - name: Run contract tests against a live instance
        if: steps.resolve.outputs.resources != ''
        env:
          DB_TYPE: sqlite
        run: |
          set -uo pipefail
          mkdir -p /tmp/contract-results
          rc=0
          for resource in ${{ steps.resolve.outputs.resources }}; do
            echo "::group::contract tests: $resource"
            mkdir -p /tmp/contract-logs
            # CONTRACT_TRACE makes the test client print one line per request, which
            # is the evidence for which declared responses and query parameters were
            # actually exercised. Captured per resource, so seeding a user while
            # testing groups is not credited to the user API.
            CONTRACT_TRACE=1 \
            TEST_JSON_OUT="/tmp/contract-results/${resource}.json" \
              make contract-test CONTRACT_PACKAGE="./contract/${resource}/..." \
              2>&1 | tee "/tmp/contract-logs/${resource}.log" || rc=1
            echo "::endgroup::"
          done
          cat /tmp/contract-results/*.json > /tmp/contract-results/all.json 2>/dev/null || true
          exit $rc
      # Reported from what the tests DID, so a test that ran and failed, or that
      # skipped, cannot be counted as coverage.
      # Reported in (operation, status) pairs observed from the server access log, so
      # a success-path-only test cannot read as full coverage of an operation.
      - name: Report contract coverage by declared response
        if: ${{ !cancelled() && steps.resolve.outputs.resources != '' }}
        run: |
          set -uo pipefail
          cd api-quality-gate && npm ci --silent
          {
            echo "## Contract coverage: declared responses and parameters"
            echo
            echo '```'
            for resource in ${{ steps.resolve.outputs.resources }}; do
              node scripts/response-path-coverage.mjs \
                --spec "api/${resource}.yaml" --log "/tmp/contract-logs/${resource}.log" || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-test-coverage:
    name: validate-test-coverage
    needs: validate-api-design
    # Scoped to the specs this pull request changed, like validate-api-design: a
    # new operation must come with a contract test, but an untouched spec's missing
    # coverage is existing debt. The scheduled audit reports coverage across the
    # whole surface instead.
    if: ${{ !cancelled() && needs.validate-api-design.result != 'skipped' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-quality-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: changed-specs
          path: /tmp/changed
        continue-on-error: true
      - name: Every operation has an operationId and a contract test
        run: |
          set -uo pipefail
          list=/tmp/changed/changed-specs.txt
          if [ ! -s "$list" ]; then
            echo "No gated spec changed by this pull request; nothing to check."
            exit 0
          fi
          rc=0
          while read -r spec; do
            [ -n "$spec" ] || continue
            resource="$(basename "$spec" .yaml)"
            echo "::group::$spec"
            CONTRACT_DIR="../tests/integration/contract/${resource}" \
              node scripts/check-coverage.mjs "../$spec" || rc=1
            echo "::endgroup::"
          done < "$list"
          exit $rc
