# ThunderID API quality gate — base ruleset.
# Run:  spectral lint <spec> -r .spectral.yaml
# In CI we lint against .spectral.effective.yaml (base + governed exemptions),
# produced by scripts/validate-exemptions.mjs. Never lint the base directly in CI,
# or exemptions won't apply.

extends: ["spectral:oas"]

functionsDir: "./functions"
functions:
  - requiredCollectionQueryParams
  - requiredErrorResponses
  - errorsUseStandardErrorSchema
  - writeHasIdempotency

rules:
  # --- Tighten a few built-ins so codegen + tooling can rely on them ----------
  operation-operationId: error        # oapi-codegen maps operationId -> handler/test
  operation-operationId-unique: error
  operation-tag-defined: error
  oas3-unused-component: warn

  # Disabled because it crashes Spectral, not because the check is unwanted. Its
  # given is a recursive descent
  #   $..[?(@property !== 'properties' && @.enum && ...)]
  # which evaluates @.enum on every node with no null guard, so any null in the
  # document throws "Cannot read properties of null (reading 'enum')" and aborts
  # the whole run. api/ou.yaml and api/resource.yaml use `parent: null` in
  # examples (valid OpenAPI: a root OU has no parent), and any spec that ever
  # documents a null would silently stop being linted. Losing duplicate-enum
  # detection is a cheaper price than that trap.
  duplicated-entry-in-enum: off

  # --- Pagination: every collection GET must page ----------------------------
  collection-get-has-pagination:
    description: >
      Collection GET endpoints must support pagination. Identity collections
      mutate under the reader, so prefer cursor pagination (`cursor`) over
      offset; `limit` is always required.
    message: "{{error}}"
    severity: error
    given: "$.paths[*]"
    then:
      function: requiredCollectionQueryParams
      functionOptions:
        requireAll: ["limit"]
        requireOneOf: ["cursor", "offset"]

  # --- Filtering: every collection GET must filter ---------------------------
  collection-get-has-filter:
    description: >
      Collection GET endpoints must support filtering. Anchor the grammar to
      SCIM 2.0 (RFC 7644 §3.4.2) rather than inventing per-endpoint query syntax.
    message: "{{error}}"
    severity: error
    given: "$.paths[*]"
    then:
      function: requiredCollectionQueryParams
      functionOptions:
        requireAll: ["filter"]

  # --- Sorting: recommended on collections -----------------------------------
  collection-get-has-sort:
    description: Collection GET endpoints should support sorting (`sort`).
    message: "{{error}}"
    severity: warn
    given: "$.paths[*]"
    then:
      function: requiredCollectionQueryParams
      functionOptions:
        requireAll: ["sort"]

  # --- Consistent error model ------------------------------------------------
  operation-has-standard-errors:
    description: >
      Every operation must declare the standard error responses. Item endpoints
      additionally declare 404; writes additionally declare 409 (conflict).
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      function: requiredErrorResponses
      functionOptions:
        base: ["400", "401", "403", "500"]
        write: ["409"]

  errors-use-standard-error-schema:
    description: >
      Error responses must serve the product's structured Error envelope as
      application/json. RFC 9457 problem+json is intentionally not required:
      ThunderID's error model is an i18n code/message/description envelope, and
      requiring problem+json only produced waivers on every spec.
    message: "{{error}}"
    severity: error
    resolved: false          # need the literal $ref to identify the schema by name
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      function: errorsUseStandardErrorSchema
      functionOptions:
        # An error response may serve application/json or RFC 9457 problem+json.
        # A SCIM-conformant surface would add application/scim+json here (RFC 7644
        # section 8.1); this API borrows only SCIM's filter grammar, not its
        # protocol, so it is not required.
        mediaTypes: ["application/json", "application/problem+json"]
        # text/plain is accepted for 500 alone: when the service is unreachable the
        # response can be produced by infrastructure rather than the application,
        # so a plain-text body is legitimate there and nowhere else.
        mediaTypesByCode:
          "500": ["text/plain"]
        # Only the application/json body is held to the agreed schema; problem+json
        # carries RFC 9457's own shape and text/plain has no schema.
        schemaMediaType: "application/json"
        schemas: ["Error", "OAuthError"]

  # --- Idempotency on creates ------------------------------------------------
  write-has-idempotency-key:
    description: >
      POST creates must accept an Idempotency-Key header so a retried request
      after a dropped response does not create a duplicate resource.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][post]"
    then:
      function: writeHasIdempotency
      functionOptions:
        methods: ["post"]
        header: "Idempotency-Key"
